<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Precision Ball</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern Mobile & iPhone 13 Safe Area Rules */
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
            --sar: env(safe-area-inset-right);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100svh; /* Dynamic viewport height for iOS Safari */
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090a0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevents default iOS gestures, pulls, and double-tap zooms */
        }

        /* Prevent default iOS Safari bounce and scroll */
        body {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Neon Glow Effects */
        .glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
        .glow-pink {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
        }

        /* Pulsing animations */
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #ec4899); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 25px #ec4899); }
        }
        .animate-heart {
            animation: heartPulse 1.2s infinite ease-in-out;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanline {
            animation: scanline 8s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-between overflow-hidden">

    <!-- Top Overlay Header -->
    <header class="w-full px-4 pt-3 pb-2 flex items-center justify-between z-10 glass-panel rounded-b-2xl max-w-lg mx-auto">
        <div class="flex items-center space-x-2">
            <span class="text-xs font-semibold tracking-wider text-cyan-400 uppercase">Stage</span>
            <span id="level-display" class="text-lg font-bold text-white bg-cyan-950/80 px-2.5 py-0.5 rounded-lg border border-cyan-500/30">1/3</span>
        </div>
        
        <div class="flex items-center space-x-3">
            <button id="sound-btn" class="p-2 rounded-xl bg-slate-800/80 border border-slate-700/60 active:scale-95 transition" aria-label="Toggle Sound">
                <svg id="sound-icon-on" class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
                <svg id="sound-icon-off" class="w-5 h-5 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-dasharray="2 2"/></svg>
            </button>
            <button id="restart-btn" class="p-2 rounded-xl bg-slate-800/80 border border-slate-700/60 active:scale-95 transition text-xs font-medium text-slate-300 flex items-center gap-1">
                <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Retry
            </button>
        </div>
    </header>

    <!-- Main Game Viewport -->
    <main id="game-container" class="relative w-full flex-1 flex items-center justify-center p-2 max-w-lg my-auto">
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full rounded-2xl glass-panel border border-cyan-500/20 shadow-2xl block"></canvas>

        <!-- Dynamic Control Hint Overlay -->
        <div id="touch-hint" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-500">
            <div class="bg-slate-900/90 border border-cyan-500/40 rounded-2xl p-4 text-center backdrop-blur-md max-w-[260px]">
                <div class="w-10 h-10 mx-auto mb-2 rounded-full border-2 border-cyan-400 flex items-center justify-center animate-bounce">
                    <div class="w-3 h-3 bg-cyan-400 rounded-full"></div>
                </div>
                <p class="text-xs text-cyan-200 font-medium">Touch & Drag anywhere to steer the neon ball</p>
            </div>
        </div>

        <!-- Heart Victory Modal / Overlay -->
        <div id="win-modal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-xl rounded-2xl flex flex-col items-center justify-center p-6 text-center z-30 opacity-0 pointer-events-none transition-all duration-700 transform scale-90">
            <!-- Animated SVG Heart Icon -->
            <div class="mb-4">
                <svg class="w-24 h-24 text-pink-500 animate-heart" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-400 mb-3 tracking-wide">
                VICTORY!
            </h2>

            <!-- Dynamic Editable Message Container -->
            <p id="win-message-text" class="text-base font-semibold text-slate-100 max-w-xs mb-6 leading-relaxed bg-slate-900/60 p-4 rounded-xl border border-pink-500/30 glow-pink">
                <!-- Text loaded dynamically from JS constant -->
            </p>

            <button id="play-again-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm tracking-wider uppercase shadow-lg active:scale-95 transition border border-pink-300/30 glow-pink">
                Play Again
            </button>
        </div>
    </main>

    <!-- Bottom Touch Control Dock -->
    <footer class="w-full px-4 pb-3 pt-1 text-center text-[10px] text-slate-500 uppercase tracking-widest max-w-lg mx-auto">
        Neon Precision Physics • Mobile Touch Optimized
    </footer>

    <!-- Game Logic Script -->
    <script>
        /* ====================================================================
           1. EDITABLE CONFIGURATION SECTION
           ==================================================================== */
        
        // EDITABLE WIN MESSAGE HERE:
        // Feel free to modify the string below to change the winning text!
        const WIN_MESSAGE = "You conquered the ultimate challenge! ❤️";

        /* ====================================================================
           2. AUDIO SYNTHESIS (Web Audio API - Safari Friendly)
           ==================================================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBounce() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            playCrash() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {}
            }

            playWin() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + idx * 0.08);
                        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                    });
                } catch (e) {}
            }
        }

        const soundFX = new SoundFX();

        /* ====================================================================
           3. GAME ENGINE & CANVAS SETUP
           ==================================================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        const levelDisplay = document.getElementById('level-display');
        const touchHint = document.getElementById('touch-hint');
        const winModal = document.getElementById('win-modal');
        const winMessageText = document.getElementById('win-message-text');

        // Set Editable Win Message Text
        winMessageText.textContent = WIN_MESSAGE;

        let canvasWidth = 360;
        let canvasHeight = 640;

        function resizeCanvas() {
            const rect = gameContainer.getBoundingClientRect();
            canvasWidth = Math.floor(rect.width);
            canvasHeight = Math.floor(rect.height);
            canvas.width = canvasWidth * window.devicePixelRatio;
            canvas.height = canvasHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        /* ====================================================================
           4. GAME STATE & PHYSICS VARIABLES
           ==================================================================== */
        let currentLevelIndex = 0;
        let isGameOver = false;
        let isGameWon = false;
        let touchStartPos = null;
        let touchCurrentPos = null;
        let particles = [];
        let hintTimeout = null;

        // Player physics object
        const player = {
            x: 50,
            y: 50,
            radius: 12,
            vx: 0,
            vy: 0,
            ax: 0,
            ay: 0,
            friction: 0.97,
            speedScale: 0.0028,
            color: '#06b6d4'
        };

        /* ====================================================================
           5. LEVEL DESIGNS (Deliberately Tough & Fast-paced)
           ==================================================================== */
        const levels = [
            // LEVEL 1: The Warmup Laser Corridor
            {
                start: { x: 0.15, y: 0.15 },
                goal: { x: 0.85, y: 0.85, radius: 24 },
                walls: [
                    { x: 0, y: 0, w: 1, h: 0.02 },
                    { x: 0, y: 0.98, w: 1, h: 0.02 },
                    { x: 0, y: 0, w: 0.02, h: 1 },
                    { x: 0.98, y: 0, w: 0.02, h: 1 },
                    { x: 0.35, y: 0, w: 0.04, h: 0.65 },
                    { x: 0.65, y: 0.35, w: 0.04, h: 0.65 }
                ],
                lasers: [
                    { x1: 0.4, y1: 0.75, x2: 0.64, y2: 0.75, speed: 2, offset: 0 },
                    { x1: 0.02, y1: 0.4, x2: 0.34, y2: 0.4, speed: 2.5, offset: Math.PI }
                ],
                gears: [
                    { x: 0.5, y: 0.2, radius: 0.08, speed: 0.04 }
                ]
            },
            // LEVEL 2: Rotating Blades & Narrow Choke Points
            {
                start: { x: 0.1, y: 0.9 },
                goal: { x: 0.9, y: 0.1, radius: 22 },
                walls: [
                    { x: 0, y: 0, w: 1, h: 0.02 },
                    { x: 0, y: 0.98, w: 1, h: 0.02 },
                    { x: 0, y: 0, w: 0.02, h: 1 },
                    { x: 0.98, y: 0, w: 0.02, h: 1 },
                    { x: 0.25, y: 0.25, w: 0.5, h: 0.03 },
                    { x: 0.25, y: 0.75, w: 0.5, h: 0.03 }
                ],
                lasers: [
                    { x1: 0.28, y1: 0.5, x2: 0.72, y2: 0.5, speed: 3.5, offset: 0 }
                ],
                gears: [
                    { x: 0.18, y: 0.5, radius: 0.09, speed: 0.05 },
                    { x: 0.82, y: 0.5, radius: 0.09, speed: -0.05 },
                    { x: 0.5, y: 0.12, radius: 0.07, speed: 0.06 }
                ]
            },
            // LEVEL 3: The Cyber Gauntlet (Hardcore)
            {
                start: { x: 0.1, y: 0.1 },
                goal: { x: 0.5, y: 0.5, radius: 20 },
                walls: [
                    { x: 0, y: 0, w: 1, h: 0.02 },
                    { x: 0, y: 0.98, w: 1, h: 0.02 },
                    { x: 0, y: 0, w: 0.02, h: 1 },
                    { x: 0.98, y: 0, w: 0.02, h: 1 },
                    { x: 0.25, y: 0.25, w: 0.03, h: 0.5 },
                    { x: 0.72, y: 0.25, w: 0.03, h: 0.5 }
                ],
                lasers: [
                    { x1: 0.02, y1: 0.35, x2: 0.25, y2: 0.35, speed: 4, offset: 0 },
                    { x1: 0.75, y1: 0.65, x2: 0.98, y2: 0.65, speed: 4.5, offset: Math.PI / 2 },
                    { x1: 0.3, y1: 0.15, x2: 0.7, y2: 0.15, speed: 3, offset: Math.PI }
                ],
                gears: [
                    { x: 0.5, y: 0.28, radius: 0.08, speed: 0.07 },
                    { x: 0.5, y: 0.72, radius: 0.08, speed: -0.07 },
                    { x: 0.32, y: 0.5, radius: 0.06, speed: 0.08 },
                    { x: 0.68, y: 0.5, radius: 0.06, speed: -0.08 }
                ]
            }
        ];

        /* ====================================================================
           6. INITIALIZATION & STAGE LOADING
           ==================================================================== */
        function loadLevel(levelIndex) {
            currentLevelIndex = levelIndex;
            const lvl = levels[currentLevelIndex];

            player.x = lvl.start.x * canvasWidth;
            player.y = lvl.start.y * canvasHeight;
            player.vx = 0;
            player.vy = 0;
            player.ax = 0;
            player.ay = 0;

            levelDisplay.textContent = `${currentLevelIndex + 1}/${levels.length}`;
            isGameOver = false;

            // Show touch hint briefly on level 1
            if (currentLevelIndex === 0) {
                touchHint.style.opacity = '1';
                clearTimeout(hintTimeout);
                hintTimeout = setTimeout(() => {
                    touchHint.style.opacity = '0';
                }, 3000);
            } else {
                touchHint.style.opacity = '0';
            }
        }

        /* ====================================================================
           7. TOUCH CONTROLS (Safari Mobile Optimized)
           ==================================================================== */
        function handleTouchStart(e) {
            e.preventDefault(); // Prevents iOS Safari gestures/scrolls
            soundFX.init();
            
            if (isGameWon) return;

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartPos = {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
            touchCurrentPos = { ...touchStartPos };
            touchHint.style.opacity = '0';
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!touchStartPos || isGameWon) return;

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchCurrentPos = {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };

            // Calculate Drag Vector
            const dx = touchCurrentPos.x - touchStartPos.x;
            const dy = touchCurrentPos.y - touchStartPos.y;

            // Set Acceleration based on touch drag displacement
            player.ax = dx * player.speedScale;
            player.ay = dy * player.speedScale;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchStartPos = null;
            touchCurrentPos = null;
            player.ax = 0;
            player.ay = 0;
        }

        // Attach non-passive listeners specifically required for Safari touch stability
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        // Mouse fallback for browser testing
        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            soundFX.init();
            isMouseDown = true;
            const rect = canvas.getBoundingClientRect();
            touchStartPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            touchCurrentPos = { ...touchStartPos };
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            touchCurrentPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            const dx = touchCurrentPos.x - touchStartPos.x;
            const dy = touchCurrentPos.y - touchStartPos.y;
            player.ax = dx * player.speedScale;
            player.ay = dy * player.speedScale;
        });
        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            touchStartPos = null;
            touchCurrentPos = null;
            player.ax = 0;
            player.ay = 0;
        });

        /* ====================================================================
           8. PARTICLES & CELEBRATION EFFECTS
           ==================================================================== */
        function spawnParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        function spawnHeartConfetti() {
            const colors = ['#ec4899', '#f43f5e', '#a855f7', '#3b82f6', '#06b6d4'];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvasWidth / 2,
                    y: canvasHeight / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 14,
                    radius: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: 0.008,
                    isHeart: Math.random() > 0.4
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                if (p.isHeart) {
                    // Draw mini heart shape
                    ctx.beginPath();
                    const topCurveHeight = p.radius * 0.3;
                    ctx.moveTo(p.x, p.y + topCurveHeight);
                    ctx.bezierCurveTo(p.x, p.y, p.x - p.radius / 2, p.y, p.x - p.radius / 2, p.y + topCurveHeight);
                    ctx.bezierCurveTo(p.x - p.radius / 2, p.y + (p.radius + topCurveHeight) / 2, p.x, p.y + p.radius, p.x, p.y + p.radius);
                    ctx.bezierCurveTo(p.x, p.y + p.radius, p.x + p.radius / 2, p.y + (p.radius + topCurveHeight) / 2, p.x + p.radius / 2, p.y + topCurveHeight);
                    ctx.bezierCurveTo(p.x + p.radius / 2, p.y, p.x, p.y, p.x, p.y + topCurveHeight);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        /* ====================================================================
           9. PHYSICS ENGINE & COLLISION DETECTION
           ==================================================================== */
        function triggerCrash() {
            if (isGameOver) return;
            isGameOver = true;
            soundFX.playCrash();
            spawnParticles(player.x, player.y, '#f43f5e', 25);
            setTimeout(() => {
                loadLevel(currentLevelIndex);
            }, 350);
        }

        function updatePhysics() {
            if (isGameOver || isGameWon) return;

            // Apply Acceleration & Friction
            player.vx += player.ax;
            player.vy += player.ay;
            player.vx *= player.friction;
            player.vy *= player.friction;

            player.x += player.vx;
            player.y += player.vy;

            const lvl = levels[currentLevelIndex];

            // 1. Wall Collisions
            lvl.walls.forEach(w => {
                const wx = w.x * canvasWidth;
                const wy = w.y * canvasHeight;
                const ww = w.w * canvasWidth;
                const wh = w.h * canvasHeight;

                // Find closest point on wall rectangle to player center
                const closestX = Math.max(wx, Math.min(player.x, wx + ww));
                const closestY = Math.max(wy, Math.min(player.y, wy + wh));

                const distX = player.x - closestX;
                const distY = player.y - closestY;
                const distanceSq = (distX * distX) + (distY * distY);

                if (distanceSq < (player.radius * player.radius)) {
                    // Collision detected! Bounce back lightly & produce sound
                    const distance = Math.sqrt(distanceSq) || 0.001;
                    const overlap = player.radius - distance;
                    const nx = distX / distance;
                    const ny = distY / distance;

                    player.x += nx * overlap;
                    player.y += ny * overlap;

                    // Bounce velocity
                    player.vx *= -0.5;
                    player.vy *= -0.5;

                    soundFX.playBounce();
                }
            });

            // Time factor for animated obstacles
            const now = Date.now() * 0.0015;

            // 2. Laser Collisions
            if (lvl.lasers) {
                lvl.lasers.forEach(laser => {
                    const lx1 = laser.x1 * canvasWidth;
                    const ly1 = laser.y1 * canvasHeight;
                    const lx2 = laser.x2 * canvasWidth;
                    const ly2 = laser.y2 * canvasHeight;

                    // Oscillating laser pulse position
                    const factor = (Math.sin(now * laser.speed + laser.offset) + 1) / 2;
                    const curX = lx1 + (lx2 - lx1) * factor;
                    const curY = ly1 + (ly2 - ly1) * factor;

                    // Laser node radius
                    const nodeRadius = 10;
                    const dx = player.x - curX;
                    const dy = player.y - curY;
                    if (Math.sqrt(dx * dx + dy * dy) < player.radius + nodeRadius) {
                        triggerCrash();
                    }
                });
            }

            // 3. Rotating Spiked Gears
            if (lvl.gears) {
                lvl.gears.forEach(gear => {
                    const gx = gear.x * canvasWidth;
                    const gy = gear.y * canvasHeight;
                    const gRadius = gear.radius * canvasWidth;

                    const dx = player.x - gx;
                    const dy = player.y - gy;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.radius + gRadius) {
                        triggerCrash();
                    }
                });
            }

            // 4. Goal Zone Collision Check
            const gx = lvl.goal.x * canvasWidth;
            const gy = lvl.goal.y * canvasHeight;
            const gRadius = lvl.goal.radius;

            const dx = player.x - gx;
            const dy = player.y - gy;
            const distToGoal = Math.sqrt(dx * dx + dy * dy);

            if (distToGoal < player.radius + gRadius) {
                // Stage Cleared!
                soundFX.playWin();
                spawnParticles(gx, gy, '#ec4899', 30);

                if (currentLevelIndex < levels.length - 1) {
                    loadLevel(currentLevelIndex + 1);
                } else {
                    // BEAT THE GAME! SHOW HEART WIN SCREEN
                    isGameWon = true;
                    spawnHeartConfetti();
                    winModal.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
                    winModal.classList.add('opacity-100', 'scale-100');
                }
            }
        }

        /* ====================================================================
           10. RENDER ENGINE (60 FPS Canvas Aesthetics)
           ==================================================================== */
        function render() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            const lvl = levels[currentLevelIndex];
            const time = Date.now() * 0.002;

            // A. Draw Goal Zone
            const gx = lvl.goal.x * canvasWidth;
            const gy = lvl.goal.y * canvasHeight;
            const gRadius = lvl.goal.radius;

            // Pulsing Goal Glow
            const pulse = Math.sin(time * 3) * 4;
            const goalGrad = ctx.createRadialGradient(gx, gy, 2, gx, gy, gRadius + pulse + 8);
            goalGrad.addColorStop(0, 'rgba(236, 72, 153, 0.9)');
            goalGrad.addColorStop(0.6, 'rgba(236, 72, 153, 0.4)');
            goalGrad.addColorStop(1, 'rgba(236, 72, 153, 0)');

            ctx.fillStyle = goalGrad;
            ctx.beginPath();
            ctx.arc(gx, gy, gRadius + pulse + 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(gx, gy, gRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Goal Heart Indicator
            ctx.fillStyle = '#f43f5e';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❤️', gx, gy);

            // B. Draw Walls
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;

            lvl.walls.forEach(w => {
                const wx = w.x * canvasWidth;
                const wy = w.y * canvasHeight;
                const ww = w.w * canvasWidth;
                const wh = w.h * canvasHeight;

                ctx.beginPath();
                ctx.roundRect(wx, wy, ww, wh, 6);
                ctx.fill();
                ctx.stroke();
            });

            // C. Draw Dynamic Lasers
            if (lvl.lasers) {
                lvl.lasers.forEach(laser => {
                    const lx1 = laser.x1 * canvasWidth;
                    const ly1 = laser.y1 * canvasHeight;
                    const lx2 = laser.x2 * canvasWidth;
                    const ly2 = laser.y2 * canvasHeight;

                    // Track guide line
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(lx1, ly1);
                    ctx.lineTo(lx2, ly2);
                    ctx.stroke();

                    // Moving Laser Node
                    const factor = (Math.sin(time * laser.speed * 0.75 + laser.offset) + 1) / 2;
                    const curX = lx1 + (lx2 - lx1) * factor;
                    const curY = ly1 + (ly2 - ly1) * factor;

                    // Laser Glow
                    const lGlow = ctx.createRadialGradient(curX, curY, 1, curX, curY, 16);
                    lGlow.addColorStop(0, '#f43f5e');
                    lGlow.addColorStop(1, 'rgba(244, 63, 94, 0)');

                    ctx.fillStyle = lGlow;
                    ctx.beginPath();
                    ctx.arc(curX, curY, 16, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(curX, curY, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // D. Draw Rotating Gears
            if (lvl.gears) {
                lvl.gears.forEach(gear => {
                    const gx = gear.x * canvasWidth;
                    const gy = gear.y * canvasHeight;
                    const gRadius = gear.radius * canvasWidth;
                    const rotation = time * gear.speed * 40;

                    ctx.save();
                    ctx.translate(gx, gy);
                    ctx.rotate(rotation);

                    ctx.fillStyle = '#e11d48';
                    ctx.strokeStyle = '#fda4af';
                    ctx.lineWidth = 2;

                    // Draw spiked gear
                    ctx.beginPath();
                    const spikes = 8;
                    for (let i = 0; i < spikes; i++) {
                        const angle = (i / spikes) * Math.PI * 2;
                        const outerX = Math.cos(angle) * (gRadius + 4);
                        const outerY = Math.sin(angle) * (gRadius + 4);
                        const innerX = Math.cos(angle + 0.2) * (gRadius - 6);
                        const innerY = Math.sin(angle + 0.2) * (gRadius - 6);

                        if (i === 0) ctx.moveTo(outerX, outerY);
                        else ctx.lineTo(outerX, outerY);
                        ctx.lineTo(innerX, innerY);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });
            }

            // E. Draw Drag Joystick Indicator
            if (touchStartPos && touchCurrentPos) {
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(touchStartPos.x, touchStartPos.y, 30, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(6, 182, 212, 0.6)';
                ctx.beginPath();
                ctx.arc(touchCurrentPos.x, touchCurrentPos.y, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            // F. Draw Particles
            drawParticles();

            // G. Draw Player Ball
            if (!isGameOver) {
                // Ball Outer Neon Glow
                const playerGlow = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, player.radius + 10);
                playerGlow.addColorStop(0, 'rgba(6, 182, 212, 0.8)');
                playerGlow.addColorStop(1, 'rgba(6, 182, 212, 0)');

                ctx.fillStyle = playerGlow;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 10, 0, Math.PI * 2);
                ctx.fill();

                // Core Ball
                ctx.fillStyle = '#67e8f9';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        /* ====================================================================
           11. MAIN GAME LOOP
           ==================================================================== */
        function gameLoop() {
            updatePhysics();
            updateParticles();
            render();
            requestAnimationFrame(gameLoop);
        }

        /* ====================================================================
           12. UI BUTTON HANDLERS & LISTENERS
           ==================================================================== */
        document.getElementById('restart-btn').addEventListener('click', () => {
            soundFX.init();
            loadLevel(currentLevelIndex);
        });

        document.getElementById('sound-btn').addEventListener('click', () => {
            soundFX.enabled = !soundFX.enabled;
            document.getElementById('sound-icon-on').classList.toggle('hidden', !soundFX.enabled);
            document.getElementById('sound-icon-off').classList.toggle('hidden', soundFX.enabled);
            if (soundFX.enabled) soundFX.init();
        });

        document.getElementById('play-again-btn').addEventListener('click', () => {
            soundFX.init();
            winModal.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
            winModal.classList.remove('opacity-100', 'scale-100');
            isGameWon = false;
            loadLevel(0);
        });

        // Initialize and setup dimensions on launch
        window.addEventListener('load', () => {
            resizeCanvas();
            loadLevel(0);
            gameLoop();
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 200);
        });
    </script>
</body>
</html>
